[project]
name = "educaptcha-agents"
version = "0.1.0"
description = "LangGraph specialists that emit risk signals for EduCAPTCHA."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.25",
    "langchain-google-genai>=2.0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["educaptcha_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
