name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Assert default bundle has no VITE_RISK_API_URL literal
        run: |
          if grep -rq "VITE_RISK_API_URL" dist/assets/*.js; then
            echo "::error::VITE_RISK_API_URL is present in the default build"
            exit 1
          fi
      - name: Secret leak guard (root .env must not reach browser)
        working-directory: .
        env:
          GOOGLE_API_KEY: BACKEND_SECRET_DO_NOT_LEAK
          LANGSMITH_API_KEY: LANGSMITH_SECRET_DO_NOT_LEAK
          VITE_RISK_API_URL: http://127.0.0.1:4599
        run: |
          cd frontend
          npm run build
          node scripts/assert-no-secret-leak.mjs
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:full
        env:
          E2E_REMOTE: "1"

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages
      - name: Smoke import
        run: uv run python -c "import educaptcha_agents; print(educaptcha_agents.__file__)"
      - run: uv run ruff check agents
      - run: uv run ruff format --check agents
      - run: uv run pytest agents/tests

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen --all-packages
      - name: Smoke import
        run: uv run python -c "import educaptcha_agents, app; print('ok')"
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run pytest backend/tests --cov=app --cov-report=term-missing
      - run: uv run --directory backend python tools/replay_corpus.py --fake --sequential
      - name: Docker build
        run: docker build -f backend/Dockerfile -t educaptcha-risk:ci .

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen --all-packages
      - run: uv run pytest backend/tests/test_catalog_parity.py -v
