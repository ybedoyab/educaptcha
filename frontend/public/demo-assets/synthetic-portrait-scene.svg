<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Synthetic portrait scene with inspectable anomalies">
  <rect width="640" height="360" fill="#E2E8F0"/>
  <rect x="40" y="40" width="280" height="280" rx="24" fill="#0F172A"/>
  <ellipse cx="180" cy="150" rx="70" ry="78" fill="#38BDF8"/>
  <ellipse cx="180" cy="250" rx="95" ry="70" fill="#0EA5A4"/>
  <circle cx="155" cy="140" r="10" fill="#0F172A"/>
  <circle cx="205" cy="140" r="10" fill="#0F172A"/>
  <path d="M155 175 Q180 195 205 175" stroke="#0F172A" stroke-width="4" fill="none"/>
  <!-- warped sign text -->
  <rect x="360" y="60" width="220" height="70" rx="10" fill="#F8FAFC" stroke="#F59E0B" stroke-width="3"/>
  <text x="380" y="105" fill="#0F172A" font-family="Segoe UI,sans-serif" font-size="28" font-weight="700" transform="rotate(-4 470 100)">HELL0</text>
  <!-- odd fingers -->
  <g transform="translate(390 180)">
    <rect width="18" height="50" rx="6" fill="#38BDF8"/>
    <rect x="22" width="18" height="62" rx="6" fill="#38BDF8"/>
    <rect x="44" width="18" height="40" rx="6" fill="#38BDF8"/>
    <rect x="66" width="18" height="70" rx="6" fill="#38BDF8"/>
    <rect x="88" width="18" height="36" rx="6" fill="#38BDF8"/>
  </g>
  <!-- inconsistent reflection -->
  <rect x="360" y="270" width="100" height="40" rx="8" fill="#0EA5A4"/>
  <rect x="480" y="275" width="100" height="30" rx="8" fill="#F59E0B" opacity="0.85"/>
  <!-- normal zone -->
  <rect x="520" y="180" width="70" height="50" rx="8" fill="#94A3B8"/>
  <!-- mismatched shadow -->
  <ellipse cx="180" cy="330" rx="90" ry="12" fill="#0F172A" opacity="0.35"/>
  <ellipse cx="260" cy="330" rx="40" ry="10" fill="#0F172A" opacity="0.2"/>
</svg>
