[project]
name = "educaptcha-risk"
version = "0.1.0"
description = "Multi-agent risk-analysis service deciding when to trigger an EduCAPTCHA verification pause."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.25",
    "langchain-google-genai>=2.0.7",
    "langsmith>=0.2",
    "cachetools>=5.5",
    "python-ulid>=3.0",
]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.19"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `live` tests hit the real Gemini API and cost money. Opt in with `-m live`.
addopts = "-q -m 'not live'"
markers = [
    "live: hits the real Gemini API (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in an argument default is the documented FastAPI idiom.
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
# LangGraph/LangChain ship partial stubs.
[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_google_genai.*", "cachetools.*", "google.cloud.*"]
ignore_missing_imports = true
