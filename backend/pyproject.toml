[project]
name = "educaptcha-risk"
version = "0.1.0"
description = "Multi-agent risk-analysis service deciding when to trigger an EduCAPTCHA verification pause."
requires-python = ">=3.11,<3.13"
dependencies = [
    "educaptcha-agents",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langsmith>=0.2",
    "cachetools>=5.5",
    "python-ulid>=3.0",
]

[tool.uv.sources]
educaptcha-agents = { workspace = true }

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.19"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
markers = [
    "live: hits the real Gemini API (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_google_genai.*", "cachetools.*", "google.cloud.*", "educaptcha_agents.*"]
ignore_missing_imports = true
